  <!--
    The page frame. The rail on the left (logo, name, "<" and headline)
    stays put while the menu and content scroll past on the right.
    On narrow screens, the name and "<" become a bar that stays at the top.
    The logo is a <picture>: in dark mode the browser loads the version
    with light pencil lines on a see-through background.
  -->
  <div class="page">
    <header class="rail">
      <picture class="logo">
        <source srcset="images/ileddigital-dark.png" media="(prefers-color-scheme: dark)">
        <img src="images/ileddigital.jpg" width="194" height="236" alt="ileddigital">
      </picture>
      <div class="rail-top">
        <a class="name" href="index.html">jon rogers</a>
        <a class="back" href="index.html" aria-label="Back to home">&lt;</a>
      </div>

    <nav class="menu" aria-label="Main">

        <li><a href="thoughts.html">thoughts</a></li>
        <li><a href="open-sauce.html">open-sauce</a></li>
      </ul>
    </nav>

    <main id="main">
  
      <!--
        The project grid. Each card is a landscape picture and a name, and the
        whole card links to that project's own page in the projects folder.
        To add a project: make its page in projects/, put a 480 x 320 picture
        in images/projects/, then copy one <li> below and change it.
        The pictures have empty alt text because the name under each one
        already says what it is.
      -->
      <section class="projects" aria-label="Projects">
        <ul>
          <li>
            <a href="projects/pegbits.html">
              <img src="images/projects/pegbits-thumb.jpg" width="480" height="320" alt="">

          </li>

            <a href="projects/selfreflector.html">
              <img src="images/projects/selfreflector-thumb.jpg" width="480" height="320" alt="">
              <span class="title">SelfReflector</span>
            </a>
          </li>
          <li>
            <a href="projects/hicams.html">
              <img src="images/projects/hicams-thumb.jpg" width="480" height="320" alt="">
              <span class="title">hiCams</span>
            </a>
